<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印记 · 会互动的小猫</title>
<style>
  :root{
    --page:#FBF8F1; --card:#FFFFFF; --ink:#33564B; --muted:#5E7C70;
    --primary:#3A9A80; --primary-dark:#2A6F5B; --soft:#E6F5EF; --mint:#B7E7D6;
    --cream:#F7D98C; --peach:#F6B8AE; --line:#F0E9DA; --field:#F4EEDD;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body{
    background:
      radial-gradient(circle at 16% 18%, rgba(183,231,214,.34) 0, rgba(183,231,214,0) 30%),
      radial-gradient(circle at 84% 82%, rgba(247,217,140,.28) 0, rgba(247,217,140,0) 32%),
      var(--page);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  ::selection{ background:var(--mint); color:var(--primary-dark); }
  *{ caret-color:var(--primary); }
  :focus-visible{ outline:2.5px solid var(--primary); outline-offset:3px; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--mint); border-radius:9px; border:2px solid var(--page); }

  .stage{ width:min(94vw,560px); position:relative; }

  /* 软糖卡：有 y 偏移 + 模糊的柔和阴影，奶油色细描边 */
  .device{
    position:relative; background:var(--card);
    border:1.5px solid var(--line); border-radius:28px;
    box-shadow:0 18px 44px rgba(107,91,74,.16), 0 3px 10px rgba(107,91,74,.06);
    padding:26px 26px 20px; overflow:hidden;
  }
  /* 顶部四色手账胶带 */
  .tape{ position:absolute; top:0; left:0; right:0; height:9px; display:flex; }
  .tape i{ flex:1; display:block; }
  .tape i:nth-child(1){ background:var(--primary); }
  .tape i:nth-child(2){ background:var(--cream); }
  .tape i:nth-child(3){ background:var(--peach); }
  .tape i:nth-child(4){ background:var(--mint); }

  .topbar{ display:flex; align-items:center; gap:10px; margin:6px 2px 2px; }
  .brand{
    width:30px; height:30px; border-radius:10px; background:var(--soft);
    display:flex; align-items:center; justify-content:center; color:var(--primary-dark);
    flex:0 0 auto;
  }
  .brand svg{ width:19px; height:19px; }
  .title{ font-size:17px; font-weight:800; letter-spacing:.02em; color:var(--ink); }
  .tag{
    margin-left:auto; font-size:11px; font-weight:700; color:var(--primary-dark);
    background:var(--soft); border-radius:999px; padding:5px 11px; letter-spacing:.04em;
  }

  /* 角色舞台：淡薄荷聚光 + 糖果色装饰点 */
  .scene-wrap{ position:relative; margin:2px 0 0; }
  .scene-wrap::before{
    content:""; position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    width:250px; height:250px; border-radius:50%;
    background:radial-gradient(circle, rgba(230,245,239,.9) 0, rgba(230,245,239,0) 70%);
    pointer-events:none;
  }
  svg#scene{ display:block; margin:0 auto; position:relative; overflow:visible; cursor:grab; touch-action:none; }
  svg#scene.grabbing{ cursor:grabbing; }
  .deco{ position:absolute; width:8px; height:8px; border-radius:50%; pointer-events:none; }
  .deco.d1{ left:14%; top:20%; background:var(--cream); }
  .deco.d2{ right:13%; top:30%; background:var(--peach); }
  .deco.d3{ left:20%; bottom:20%; background:var(--mint); }
  .deco.d4{ right:18%; bottom:26%; width:6px; height:6px; background:var(--primary); opacity:.5; }
  .sprout{ position:absolute; width:26px; height:26px; color:var(--primary); opacity:.5; }
  .sprout.left{ left:2%; bottom:8%; }
  .sprout.right{ right:2%; top:6%; transform:scaleX(-1); }

  .hint{ margin-top:2px; font-size:12.5px; color:var(--muted); letter-spacing:.03em; height:18px; text-align:center; }

  .progress{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:12px auto 0; width:max-content;
    background:var(--field); border:1.5px solid var(--line); border-radius:999px;
    padding:7px 16px 7px 18px; font-size:13px; font-weight:700; color:var(--primary-dark);
  }
  .progress .lead{ font-weight:600; color:var(--ink); font-size:12px; }
  .progress b{ font-size:15px; }
  .dots{ display:flex; gap:7px; align-items:center; }
  .dots i{ width:8px; height:8px; border-radius:50%; background:var(--mint); display:block; transition:transform .25s, box-shadow .25s; }
  .dots i:nth-child(2){ background:var(--cream); }
  .dots i:nth-child(3){ background:var(--peach); }
  .dots i.on{ transform:scale(1.45); box-shadow:0 0 0 3px rgba(58,154,128,.16); }

  .controls{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; align-items:center; margin-top:16px; }
  .controls .sep{ width:1px; height:22px; background:var(--line); margin:0 3px; }
  button{
    font-family:inherit; font-size:12px; font-weight:700; color:var(--primary-dark);
    background:#fff; border:1.5px solid var(--line); border-radius:999px;
    padding:7px 13px; cursor:pointer; transition:background .16s, transform .16s, border-color .16s, color .16s;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; line-height:1;
  }
  button .ic{ width:15px; height:15px; flex:0 0 auto; }
  button:hover{ background:var(--soft); transform:translateY(-1px); }
  button:active{ transform:translateY(1px); }
  button.on, button.mood.on{ background:var(--primary-dark); border-color:var(--primary-dark); color:#fff; }
  .waves{ opacity:0; } .mute{ opacity:1; }
  #btnSound.on .waves{ opacity:1; } #btnSound.on .mute{ opacity:0; }
  .tips{ margin-top:14px; font-size:11px; color:#4A6558; letter-spacing:.02em; line-height:1.8; text-align:center; }

  #bubble{
    position:absolute; left:50%; top:20px; transform:translate(-50%,6px) scale(.9);
    background:#fff; border:1.5px solid var(--line); border-radius:999px;
    padding:7px 16px; font-size:12.5px; font-weight:700; color:var(--primary-dark);
    box-shadow:0 8px 22px rgba(107,91,74,.16); opacity:0; transition:transform .22s, opacity .22s;
    white-space:nowrap; pointer-events:none; z-index:5;
  }
  #bubble.show{ opacity:1; transform:translate(-50%,0) scale(1); }
  #fx{ position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:4; }
  .fx{ position:absolute; font-size:20px; animation:floatUp 1.25s ease-out forwards; }
  @keyframes floatUp{
    0%{ opacity:0; transform:translateY(12px) scale(.6) rotate(-8deg); }
    18%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-96px) scale(1.2) rotate(10deg); }
  }
  /* 确定性截帧时隐藏交互控件，保证 GIF/MP4 与纯动画一致 */
  body.capture .controls, body.capture #bubble, body.capture #fx, body.capture .tips{ display:none; }
  body.capture .hint{ margin-top:8px; }
  body.capture .progress{ margin-top:18px; }
  body.capture .dots{ margin-top:16px; }
  body.capture .deco, body.capture .sprout{ display:none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="device">
    <div class="tape"><i></i><i></i><i></i><i></i></div>

    <div class="topbar">
      <span class="brand" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7" cy="8.5" r="1.5"/><circle cx="12" cy="6.5" r="1.5"/><circle cx="17" cy="8.5" r="1.5"/>
          <path d="M12 11.5c-3 0-5 2.4-5 4.4 0 2 2.2 3.1 5 3.1s5-1.1 5-3.1c0-2-2-4.4-5-4.4z"/>
        </svg>
      </span>
      <span class="title">印记 · 小喵</span>
      <span class="tag">互动演示</span>
    </div>

    <div class="scene-wrap">
      <span class="deco d1"></span><span class="deco d2"></span>
      <span class="deco d3"></span><span class="deco d4"></span>
      <svg class="sprout left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11"/><path d="M12 13C8 13 6 10 6 7c3 0 6 2 6 6z"/><path d="M12 15c4 0 6-3 6-6-3 0-6 2-6 6z"/></svg>
      <svg class="sprout right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11"/><path d="M12 13C8 13 6 10 6 7c3 0 6 2 6 6z"/><path d="M12 15c4 0 6-3 6-6-3 0-6 2-6 6z"/></svg>

      <svg id="scene" width="360" height="300" viewBox="0 0 360 300" aria-label="简笔画小猫，点一下可以互动">
        <defs>
          <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#E6F5EF" stop-opacity=".8"/>
            <stop offset="100%" stop-color="#E6F5EF" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <circle id="halo" cx="180" cy="158" r="112" fill="url(#haloGrad)"/>
        <g id="particles"></g>
        <g id="drops"></g>

        <g id="buddy" fill="none" stroke="#33564B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M138 210 Q116 246 128 276 L232 276 Q244 246 222 210" fill="#FFFDF6"/>
          <g id="stem">
            <path d="M228 272 Q278 278 276 230 Q275 212 258 214"/>
          </g>
          <g id="leafL" data-zone="leaf">
            <path d="M132 112 L126 52 L174 90 Z" fill="#FFFDF6"/>
            <path d="M140 104 L138 68 L162 90 Z" fill="#F6C9C0" stroke="none"/>
          </g>
          <g id="leafR" data-zone="leaf">
            <path d="M228 112 L234 52 L186 90 Z" fill="#FFFDF6"/>
            <path d="M220 104 L222 68 L198 90 Z" fill="#F6C9C0" stroke="none"/>
          </g>

          <circle id="face" data-zone="face" cx="180" cy="160" r="64" fill="#FFFDF6"/>

          <g stroke-width="2.2" stroke="#7E9A8E">
            <path d="M114 170 L82 164"/><path d="M112 180 L78 180"/><path d="M114 190 L82 196"/>
            <path d="M246 170 L278 164"/><path d="M248 180 L282 180"/><path d="M246 190 L278 196"/>
          </g>

          <g id="blush" stroke="none">
            <ellipse cx="140" cy="180" rx="9" ry="5" fill="#F6B8AE" opacity=".55"/>
            <ellipse cx="220" cy="180" rx="9" ry="5" fill="#F6B8AE" opacity=".55"/>
          </g>

          <g id="eyeDots" stroke="none" fill="#33564B">
            <circle id="eyeL" cx="156" cy="154" r="5"/>
            <circle id="eyeR" cx="204" cy="154" r="5"/>
          </g>
          <g id="eyeArcs" opacity="0" fill="none" stroke="#33564B" stroke-width="3.4">
            <path id="arcL" d="M146 152 Q156 162 166 152"/>
            <path id="arcR" d="M194 152 Q204 162 214 152"/>
          </g>
          <g id="eyeX" opacity="0" stroke="#33564B" stroke-width="3" fill="none">
            <path d="M150 148 L164 162 M164 148 L150 162"/>
            <path d="M196 148 L210 162 M210 148 L196 162"/>
          </g>

          <path d="M175 174 L185 174 L180 179 Z" fill="#F6B8AE" stroke-width="2"/>
          <path id="smile" d="M166 183 Q173 191 180 183 Q187 191 194 183" stroke-width="3"/>
          <ellipse id="mouthO" cx="180" cy="186" rx="5" ry="7" fill="none" stroke="#33564B" stroke-width="3" opacity="0"/>

          <g id="hl"></g>

          <circle data-zone="cheek" cx="142" cy="180" r="16" fill="transparent" stroke="none" pointer-events="all"/>
          <circle data-zone="cheek" cx="218" cy="180" r="16" fill="transparent" stroke="none" pointer-events="all"/>
          <circle data-zone="tummy" cx="180" cy="246" r="20" fill="transparent" stroke="none" pointer-events="all"/>
        </g>

        <g id="feet" opacity="0" fill="#FFFDF6" stroke="#33564B" stroke-width="3" stroke-linejoin="round">
          <ellipse cx="154" cy="276" rx="12" ry="7"/>
          <ellipse cx="206" cy="276" rx="12" ry="7"/>
        </g>
      </svg>
    </div>

    <div class="hint" id="hint">点一下喂它小鱼干 🐟</div>
    <div class="progress"><span class="lead">小鱼干</span><b id="count">0 / 3</b><span class="dots" id="dots"><i></i><i></i><i></i></span></div>

    <div class="controls" id="controls">
      <button id="btnWater" title="喂小鱼"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c2.5-4.5 9-4.5 12 0-3 4.5-9.5 4.5-12 0z"/><path d="M16 12l4-3v6z"/><circle cx="8" cy="11.3" r=".8" fill="currentColor" stroke="none"/></svg><span class="lbl">喂小鱼</span></button>
      <button id="btnPet" title="摸摸头"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-9a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 4.5-7 9-7 9z"/></svg><span class="lbl">摸摸头</span></button>
      <button id="btnSleep" title="睡觉"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span class="lbl">睡觉</span></button>
      <button id="btnReset" title="重来"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.5 9A7 7 0 0 1 18 7l2 2M17.5 15A7 7 0 0 1 6 17l-2-2"/></svg><span class="lbl">重来</span></button>
      <span class="sep"></span>
      <button class="mood on" data-mood="happy">开心</button>
      <button class="mood" data-mood="surprised">惊喜</button>
      <button class="mood" data-mood="shy">害羞</button>
      <button class="mood" data-mood="sleepy">困困</button>
      <span class="sep"></span>
      <button id="btnSound" title="音效"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><g class="waves"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7 7 0 0 1 0 11"/></g><g class="mute"><path d="M16 9l5 6M21 9l-5 6"/></g></svg><span class="lbl">音效</span></button>
    </div>
    <div class="tips">点一下喂小鱼 · 长按摸摸头 · 拖动甩一甩 · 双击哄睡觉 · 戳脸/耳朵有反应 · 鼠标动它会看你<br>键盘：空格喂小鱼 / Z 睡觉 / 1-4 换心情 / R 重来</div>
  </div>

  <div id="bubble">喵～</div>
  <div id="fx"></div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var buddy=$('buddy'), leafL=$('leafL'), leafR=$('leafR'), eyeDots=$('eyeDots'),
      eyeL=$('eyeL'), eyeR=$('eyeR'), eyeArcs=$('eyeArcs'), arcL=$('arcL'), arcR=$('arcR'),
      eyeX=$('eyeX'), mouthO=$('mouthO'), blush=$('blush'), smile=$('smile'), stem=$('stem'),
      halo=$('halo'), feet=$('feet'), particles=$('particles'), drops=$('drops'),
      countEl=$('count'), hint=$('hint'), stage=$('stage'), scene=$('scene'),
      bubble=$('bubble'), fx=$('fx'), dots=$('dots');

  // ---------- 确定性粒子 / 小鱼干 ----------
  var P=[], rnd=function(i){ var x=Math.sin(i*127.1+3.7)*43758.5453; return x-Math.floor(x); };
  for(var i=0;i<6;i++){
    var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    var px=48+rnd(i)*264, py=50+rnd(i+40)*200, r=2+rnd(i+80)*3;
    var cols=['#B7E7D6','#F7D98C','#F6B8AE','#E6F5EF'];
    c.setAttribute('cx',px.toFixed(1)); c.setAttribute('cy',py.toFixed(1));
    c.setAttribute('r',r.toFixed(1)); c.setAttribute('fill',cols[i%4]);
    c.setAttribute('opacity','.55');
    particles.appendChild(c);
    P.push({el:c, x:px, y:py, ph:rnd(i+120)*6.28, sp:.5+rnd(i+160)*.7, amp:6+rnd(i+200)*8});
  }
  var D=[];
  for(var j=0;j<5;j++){
    var d=document.createElementNS('http://www.w3.org/2000/svg','path');
    d.setAttribute('d','M-7 0 Q0 -5 7 0 Q0 5 -7 0 Z M7 0 L12 -4 L12 4 Z');
    d.setAttribute('fill','#EBA98E'); d.setAttribute('opacity','0');
    drops.appendChild(d);
    D.push({el:d, x:180+(j-2)*20, off:j*.12});
  }

  // ---------- 状态 ----------
  var S = {
    progress:0, mood:'happy', moodUntil:0, sleeping:false,
    popT:-1, petT:-1, winkUntil:0, dizzyUntil:0, leafWiggle:0, giggle:0,
    eyesX:0, eyesY:0, dragOff:{x:0,y:0,rot:0}, drag:null,
    running:true, frozen:false, t0:0, sound:false, bubbleUntil:0,
    faceMood:'happy'
  };

  var LINES = {
    water:['喵呜～好吃！','再来一条小鱼干～','尾巴摇摇 🐾','谢谢你呀 ♡'],
    leaf:['别揪耳朵呀～','耳朵痒痒！','喵！'],
    cheek:['嘿嘿～','被你戳到啦','好害羞…'],
    tummy:['呀！别戳肚肚','呼噜呼噜～','踩奶中…'],
    pet:['呼噜呼噜～','再摸摸～','最喜欢你了 ♡'],
    drag:['晕乎乎…','慢一点啦！','转圈圈～'],
    sleep:['困了…Zzz','晚安 🌙','呼…呼…'],
    wake:['醒啦！','啊，睡过头了','精神满满 ✨'],
    bloom:['吃撑啦，好满足！🐾','三条小鱼全吃完～','谢谢你陪我玩'],
    reset:['再喂一次！','从头开始咯','准备好啦～'],
    mood:{happy:['今天心情超好！'],surprised:['喵！吓一跳'],shy:['别、别看我…'],sleepy:['有点困了…']}
  };
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function say(text, ms){
    bubble.textContent = text; bubble.classList.add('show');
    S.bubbleUntil = performance.now() + (ms||1500);
  }
  function setHint(t){ hint.textContent = t; }

  // ---------- 音效（可选，默认关） ----------
  var actx=null;
  function blip(freq, dur){
    if(!S.sound) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.07, actx.currentTime+.015);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+(dur||.16));
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+(dur||.16)+.02);
    }catch(e){}
  }

  // ---------- 漂浮表情 ----------
  function floatEmoji(ch, x, y, n){
    n = n || 1;
    for(var i=0;i<n;i++){
      (function(k){
        setTimeout(function(){
          var e=document.createElement('span');
          e.className='fx'; e.textContent=ch;
          e.style.left=(x+(Math.random()-0.5)*60)+'px';
          e.style.top =(y+(Math.random()-0.5)*24)+'px';
          fx.appendChild(e);
          setTimeout(function(){ e.remove(); },1300);
        }, k*110);
      })(i);
    }
  }
  function fxPos(e){
    var r=stage.getBoundingClientRect();
    return { x:(e.clientX!=null?e.clientX:180)-r.left, y:(e.clientY!=null?e.clientY:180)-r.top };
  }

  // ---------- 表情渲染 ----------
  function applyFace(t, blink){
    var m = S.frozen ? 'happy' : S.faceMood;
    var wink = !S.frozen && performance.now() < S.winkUntil;
    var showDots = (m==='happy'||m==='surprised');
    eyeDots.setAttribute('opacity', showDots?'1':'0');
    eyeArcs.setAttribute('opacity', (m==='loved'||m==='shy'||m==='sleepy'||m==='sleep')?'1':'0');
    eyeX.setAttribute('opacity', m==='dizzy'?'1':'0');
    mouthO.setAttribute('opacity', (m==='surprised'||m==='sleep')?'1':'0');
    smile.setAttribute('opacity', (m==='surprised'||m==='sleep')?'0':'1');

    var r = m==='surprised' ? 7 : 5;
    eyeL.setAttribute('r', r);
    eyeR.setAttribute('r', wink ? 0.8 : r);
    eyeDots.setAttribute('transform',
      'translate('+S.eyesX.toFixed(2)+' '+S.eyesY.toFixed(2)+') '+
      'translate(180 154) scale(1 '+blink.toFixed(3)+') translate(-180 -154)');

    if(m==='sleep'||m==='sleepy'){
      arcL.setAttribute('d','M146 154 Q156 146 166 154');
      arcR.setAttribute('d','M194 154 Q204 146 214 154');
    } else {
      arcL.setAttribute('d','M146 152 Q156 162 166 152');
      arcR.setAttribute('d','M194 152 Q204 162 214 152');
    }
    if(m==='shy'){
      blush.setAttribute('opacity','1');
      smile.setAttribute('d','M172 183 Q176 189 180 183 Q184 189 188 183');
    } else {
      smile.setAttribute('d', smilePath(t));
    }
  }
  function smilePath(t){
    var s3=Math.sin(t*Math.PI*2+1.6);
    var lift=2+s3*0.8+S.progress*0.5;
    return 'M166 '+(183-lift/2).toFixed(1)+' Q173 '+(189+lift).toFixed(1)+' 180 '+(183-lift/2).toFixed(1)+
           ' Q187 '+(189+lift).toFixed(1)+' 194 '+(183-lift/2).toFixed(1);
  }

  // ---------- 帧渲染（idle 动画 + 交互叠加；frozen 时与原版逐像素一致） ----------
  function frame(t){
    var s=Math.sin(t*Math.PI*2), s2=Math.sin(t*Math.PI*4+0.8), s3=Math.sin(t*Math.PI*2+1.6);
    var grow=1+S.progress*0.06;
    var pop=0, popSq=1;
    if(S.popT>=0){
      var p=S.popT/0.55;
      if(p<1){ pop=-Math.sin(p*Math.PI)*14; popSq=1+Math.sin(p*Math.PI)*0.07; }
    }
    var breathe=1+(s2*0.014)*grow;
    var d=S.dragOff;
    buddy.setAttribute('transform',
      'translate('+d.x.toFixed(2)+' '+d.y.toFixed(2)+') rotate('+d.rot.toFixed(2)+' 180 168) '+
      'translate(180 168) scale('+(breathe*grow*popSq).toFixed(4)+') translate(-180 -168) '+
      'translate(0 '+(s*3+pop).toFixed(2)+')');

    var wig=S.frozen?0:S.leafWiggle;
    var ear=s*3.5+wig*Math.sin(t*90)*5;
    leafL.setAttribute('transform','rotate('+(-ear).toFixed(2)+' 132 112)');
    leafR.setAttribute('transform','rotate('+(ear).toFixed(2)+' 228 112)');
    stem.setAttribute('transform','rotate('+(s*7).toFixed(2)+' 228 272)');

    var bt=t*4 % 1;
    var blink=(bt<0.035||(bt>0.46&&bt<0.495)) ? 0.12 : 1;
    applyFace(t, blink);

    blush.setAttribute('opacity',(0.45+0.15*s3).toFixed(3));
    halo.setAttribute('r',(106+s2*5+S.progress*6).toFixed(1));
    feet.setAttribute('opacity', S.popT>=0 ? '0.9' : '0');

    for(var i=0;i<P.length;i++){
      var q=P[i], dy=Math.sin(t*Math.PI*2*q.sp+q.ph)*q.amp;
      q.el.setAttribute('cy',(q.y+dy).toFixed(1));
      q.el.setAttribute('cx',(q.x+Math.cos(t*Math.PI*2*q.sp*.6+q.ph)*3).toFixed(1));
    }
    for(var k=0;k<D.length;k++){
      var w=D[k];
      if(S.popT>=0){
        var lp=(S.popT-w.off)/0.5;
        if(lp>0 && lp<1){
          w.el.setAttribute('opacity',(1-lp).toFixed(2));
          w.el.setAttribute('transform','translate('+w.x+' '+(60+lp*70)+') scale('+(0.9+lp*0.4).toFixed(2)+')');
        } else w.el.setAttribute('opacity','0');
      } else w.el.setAttribute('opacity','0');
    }
  }

  // ---------- 实时循环 ----------
  function loop(now){
    if(!S.running) return;
    if(!S.t0) S.t0=now;
    var t=((now-S.t0)/4000)%1;

    if(S.popT>=0){ S.popT+=1/60; if(S.popT>0.8) S.popT=-1; }
    if(S.petT>=0){ S.petT+=1/60; if(S.petT>1.4) S.petT=-1; }
    if(S.leafWiggle>0) S.leafWiggle=Math.max(0,S.leafWiggle-0.03);
    if(S.giggle>0){ S.giggle-=1/60; S.popT=Math.max(S.popT,0.05); }

    if(S.drag && S.drag.spring){
      var g=S.drag;
      g.vx=(g.vx - g.x*0.16)*0.84;
      g.vy=(g.vy - g.y*0.16)*0.84;
      g.x+=g.vx; g.y+=g.vy; g.rot*=0.87;
      S.dragOff={x:g.x,y:g.y,rot:g.rot};
      if(Math.abs(g.x)+Math.abs(g.y)+Math.abs(g.vx)+Math.abs(g.vy)+Math.abs(g.rot)<0.8){
        S.drag=null; S.dragOff={x:0,y:0,rot:0}; S.dizzyUntil=0;
      }
    } else if(S.drag){
      S.dragOff={x:S.drag.x,y:S.drag.y,rot:S.drag.rot};
    }

    if(S.sleeping) S.faceMood='sleep';
    else if(S.drag && S.drag.spring && (Math.abs(S.drag.x)+Math.abs(S.drag.y)>6)) S.faceMood='dizzy';
    else if(S.petT>=0) S.faceMood='loved';
    else if(now<S.moodUntil) S.faceMood=S.mood;
    else S.faceMood='happy';

    if(now>S.bubbleUntil) bubble.classList.remove('show');
    frame(t);
    requestAnimationFrame(loop);
  }

  // ---------- 交互动作 ----------
  function syncProgress(){
    countEl.textContent=S.progress+' / 3';
    var ds=dots.children;
    for(var i=0;i<3;i++) ds[i].classList.toggle('on', i<S.progress);
  }
  function setSleepLabel(txt){ var b=$('btnSleep'); if(b){ var l=b.querySelector('.lbl'); if(l) l.textContent=txt; } }
  function water(zone, e){
    if(S.sleeping){ wake(e); return; }
    var p=fxPos(e||{clientX:180,clientY:180});
    if(S.progress>=3){
      S.progress=0; syncProgress();
      say(pick(LINES.reset)); floatEmoji('🐾',p.x,p.y-40,7);
      blip(660,.22); setHint('点一下喂它小鱼干 🐟'); return;
    }
    S.progress++; syncProgress(); S.popT=0; blip(520+S.progress*90,.16);
    floatEmoji('🐟',p.x,p.y-70,3);
    if(zone==='leaf'){ S.leafWiggle=1; say(pick(LINES.leaf)); }
    else if(zone==='cheek'){ S.winkUntil=performance.now()+700; say(pick(LINES.cheek)); floatEmoji('💗',p.x,p.y,2); }
    else if(zone==='tummy'){ S.giggle=0.5; say(pick(LINES.tummy)); floatEmoji('✨',p.x,p.y,3); }
    else say(pick(LINES.water));
    if(S.progress>=3){ say(pick(LINES.bloom),1900); floatEmoji('🎉',p.x,p.y-60,6); blip(880,.3); setHint('吃撑啦！再点一下重新喂 🐟'); }
    else setHint(S.progress===1?'再来一条小鱼干～':'快吃饱啦，还差一条 ✨');
  }
  function pet(e){
    var p=fxPos(e||{clientX:180,clientY:150});
    S.petT=0; S.faceMood='loved'; say(pick(LINES.pet),1600);
    floatEmoji('💗',p.x,p.y,5); blip(700,.2); setHint('被摸头摸得眯起眼啦～');
  }
  function setMood(m){
    S.mood=m; S.moodUntil=performance.now()+2600; S.faceMood=m;
    say(pick(LINES.mood[m])); blip(m==='surprised'?880:m==='shy'?440:600,.14);
    var bs=document.querySelectorAll('[data-mood]');
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-mood')===m);
  }
  function toggleSleep(){
    S.sleeping=!S.sleeping;
    $('btnSleep').classList.toggle('on',S.sleeping);
    setSleepLabel(S.sleeping ? '唤醒' : '睡觉');
    if(S.sleeping){ S.faceMood='sleep'; say(pick(LINES.sleep),2200); floatEmoji('💤',450,120,3); setHint('睡着了…点它一下叫醒'); blip(300,.3); }
    else { S.faceMood='happy'; S.popT=0; say(pick(LINES.wake)); setHint('点一下喂它小鱼干 🐟'); blip(820,.18); }
  }
  function wake(e){
    S.sleeping=false; S.faceMood='surprised'; S.mood='surprised'; S.moodUntil=performance.now()+900;
    $('btnSleep').classList.remove('on'); setSleepLabel('睡觉');
    S.popT=0; say(pick(LINES.wake)); floatEmoji('✨',fxPos(e||{clientX:180,clientY:150}).x,100,4);
    setHint('点一下喂它小鱼干 🐟'); blip(840,.18);
  }
  function reset(){
    S.progress=0; syncProgress(); S.sleeping=false; S.mood='happy'; S.moodUntil=0;
    S.popT=-1; S.petT=-1; S.drag=null; S.dragOff={x:0,y:0,rot:0};
    $('btnSleep').classList.remove('on'); setSleepLabel('睡觉');
    setMood('happy'); say(pick(LINES.reset)); setHint('点一下喂它小鱼干 🐟'); blip(520,.14);
  }

  // ---------- 指针交互 ----------
  var press=null, longTimer=null, pendingClicks=[];
  function zoneOf(target){
    var n=target;
    while(n && n!==scene){
      if(n.getAttribute && n.getAttribute('data-zone')) return n.getAttribute('data-zone');
      n=n.parentNode;
    }
    return 'face';
  }
  scene.addEventListener('pointerdown', function(e){
    if(S.frozen) return;
    scene.setPointerCapture(e.pointerId);
    if(pendingClicks.length){ pendingClicks.forEach(clearTimeout); pendingClicks=[]; }
    if(longTimer){ clearTimeout(longTimer); longTimer=null; }
    press={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,longFired:false,zone:zoneOf(e.target)};
    S.drag={x:0,y:0,rot:0,vx:0,vy:0,spring:false};
    scene.classList.add('grabbing');
    longTimer=setTimeout(function(){
      if(press && !press.moved){
        press.longFired=true;
        if(S.sleeping) wake(e); else pet(e);
      }
    },450);
  });
  document.addEventListener('pointermove', function(e){
    if(!S.frozen){
      var r=scene.getBoundingClientRect();
      var nx=(e.clientX-(r.left+r.width/2))/(r.width/2), ny=(e.clientY-(r.top+r.height/2))/(r.height/2);
      S.eyesX=Math.max(-1,Math.min(1,nx))*3.2;
      S.eyesY=Math.max(-1,Math.min(1,ny))*2.4;
    }
    if(!press) return;
    var dx=e.clientX-press.x, dy=e.clientY-press.y;
    if(!press.moved && Math.abs(dx)+Math.abs(dy)>9){
      press.moved=true; if(longTimer){ clearTimeout(longTimer); longTimer=null; }
    }
    if(press.moved && S.drag && !S.drag.spring){
      S.drag.x=dx; S.drag.y=dy; S.drag.rot=dx*0.06;
      S.drag.vx=dx-S.drag.x;
      S.dragOff={x:dx,y:dy,rot:S.drag.rot};
      S.faceMood='dizzy';
    }
  });
  function endPress(e){
    if(!press) return;
    var pr=press; press=null;
    if(longTimer){ clearTimeout(longTimer); longTimer=null; }
    scene.classList.remove('grabbing');
    if(pr.moved){
      if(S.drag){ S.drag.spring=true; S.drag.vx=(Math.random()-0.5)*4; S.drag.vy=-6; }
      S.dizzyUntil=performance.now()+1400; say(pick(LINES.drag)); setHint('甩得有点晕…松手就弹回来啦'); blip(380,.22);
    } else if(pr.longFired){
      // 已触发摸头
    } else {
      var t=setTimeout(function(){ water(pr.zone, e); },170);
      pendingClicks.push(t);
    }
  }
  scene.addEventListener('pointerup', endPress);
  scene.addEventListener('pointercancel', endPress);
  scene.addEventListener('dblclick', function(e){
    e.preventDefault();
    if(pendingClicks.length){ pendingClicks.forEach(clearTimeout); pendingClicks=[]; }
    toggleSleep();
  });

  // ---------- 按钮 / 键盘 ----------
  $('btnWater').addEventListener('click', function(){ water('face', {clientX:180,clientY:180}); });
  $('btnPet').addEventListener('click', function(){ pet({clientX:180,clientY:140}); });
  $('btnSleep').addEventListener('click', toggleSleep);
  $('btnReset').addEventListener('click', reset);
  $('btnSound').addEventListener('click', function(){
    S.sound=!S.sound;
    this.classList.toggle('on',S.sound);
    if(S.sound) blip(700,.14);
  });
  var moods=document.querySelectorAll('[data-mood]');
  for(var mi=0;mi<moods.length;mi++){
    moods[mi].addEventListener('click', function(){ setMood(this.getAttribute('data-mood')); });
  }
  document.addEventListener('keydown', function(e){
    if(e.code==='Space'){ e.preventDefault(); water('face',{clientX:180,clientY:180}); }
    else if(e.key==='z'||e.key==='Z') toggleSleep();
    else if(e.key==='r'||e.key==='R') reset();
    else if(e.key==='1') setMood('happy');
    else if(e.key==='2') setMood('surprised');
    else if(e.key==='3') setMood('shy');
    else if(e.key==='4') setMood('sleepy');
    else if(e.key==='m'||e.key==='M') pet({clientX:180,clientY:140});
  });

  // ---------- 确定性截帧接口（供 capture_sprout.cjs 使用） ----------
  window.setFrame=function(i,total){
    S.running=false; S.frozen=true;
    document.body.classList.add('capture');
    S.popT=-1; S.petT=-1; S.drag=null; S.dragOff={x:0,y:0,rot:0};
    S.eyesX=0; S.eyesY=0; S.faceMood='happy'; S.leafWiggle=0;
    bubble.classList.remove('show');
    frame(i/total);
  };
  window.setProgress=function(p){
    S.progress=Math.max(0,Math.min(3,p));
    countEl.textContent=S.progress+' / 3';
  };
  window.resume=function(){
    S.frozen=false; S.running=true; S.t0=0;
    document.body.classList.remove('capture');
    requestAnimationFrame(loop);
  };
  window.doAction=function(name){
    if(name==='water') water('face',{clientX:180,clientY:180});
    else if(name==='pet') pet({clientX:180,clientY:140});
    else if(name==='sleep') toggleSleep();
    else if(name==='reset') reset();
    else if(name && name.indexOf('mood:')===0) setMood(name.slice(5));
  };
  window.getState=function(){
    return {progress:S.progress, sleeping:S.sleeping, mood:S.mood,
            faceMood:S.faceMood, bubble:bubble.textContent, sound:S.sound};
  };

  syncProgress();
  requestAnimationFrame(loop);
})();
</script>
</body>
