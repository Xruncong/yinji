<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印记 · 会动的小芽</title>
<style>
  * { box-sizing: border-box; }
  html,body { height:100%; margin:0; }
  body {
    background: radial-gradient(circle at 18% 22%, #E9F6F0 0%, rgba(233,246,240,0) 42%),
                radial-gradient(circle at 82% 78%, #FDF3DC 0%, rgba(253,243,220,0) 46%),
                #FBF8F1;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color:#33564B; display:flex; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; user-select:none;
  }
  .stage { width:min(92vw, 900px); text-align:center; position:relative; }
  h1 { font-size:15px; letter-spacing:.22em; color:#5E7C70; font-weight:600; margin:0 0 4px; }
  .sub { font-size:12px; color:#8AA69B; margin:0 0 18px; letter-spacing:.08em; }
  svg { display:block; margin:0 auto; overflow:visible; }
  .hint { margin-top:10px; font-size:12px; color:#8AA69B; letter-spacing:.06em; }
  .pill {
    display:inline-flex; align-items:center; gap:8px; margin-top:16px;
    background:#fff; border:2px solid #EADFC6; border-radius:999px;
    padding:8px 18px; font-size:13px; font-weight:700; color:#2A6F5B;
    box-shadow:0 6px 18px rgba(107,91,74,.10);
  }
  .pill b { font-size:16px; }
  .dots { display:flex; gap:7px; justify-content:center; margin-top:14px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:#B7E7D6; display:block; }
  .dots i:nth-child(2){ background:#F7D98C; } .dots i:nth-child(3){ background:#F6B8AE; }
  .float { position:absolute; border-radius:50%; pointer-events:none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <h1>印 记 · 小 芽</h1>
  <p class="sub">奶油薄荷 · 小芽生长</p>

  <svg id="scene" width="360" height="330" viewBox="0 0 360 330" aria-label="会动的笑脸小芽">
    <defs>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#E6F5EF" stop-opacity=".95"/>
        <stop offset="100%" stop-color="#E6F5EF" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- 光晕 -->
    <circle id="halo" cx="180" cy="176" r="118" fill="url(#halo)"/>

    <!-- 漂浮小圆点 -->
    <g id="particles"></g>

    <!-- 浇水水滴（点击时） -->
    <g id="drops"></g>

    <!-- 小芽整体 -->
    <g id="buddy">
      <!-- 茎 -->
      <path id="stem" d="M180 118 L180 84" stroke="#2A6F5B" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- 左叶 -->
      <g id="leafL">
        <ellipse cx="158" cy="76" rx="24" ry="13" fill="#3A9A80" transform="rotate(-32 158 76)"/>
      </g>
      <!-- 右叶 -->
      <g id="leafR">
        <ellipse cx="202" cy="76" rx="24" ry="13" fill="#6FC4A6" transform="rotate(32 202 76)"/>
      </g>
      <!-- 脸 -->
      <circle cx="180" cy="184" r="66" fill="#FFF7E8" stroke="#EADFC6" stroke-width="3.5"/>
      <!-- 腮红 -->
      <g id="blush">
        <ellipse cx="142" cy="196" rx="10" ry="5.5" fill="#F6B8AE" opacity=".85"/>
        <ellipse cx="218" cy="196" rx="10" ry="5.5" fill="#F6B8AE" opacity=".85"/>
      </g>
      <!-- 眼睛 -->
      <g id="eyes">
        <circle cx="158" cy="178" r="5" fill="#33564B"/>
        <circle cx="202" cy="178" r="5" fill="#33564B"/>
      </g>
      <!-- 微笑 -->
      <path id="smile" d="M164 202 Q180 216 196 202" stroke="#33564B" stroke-width="4"
            stroke-linecap="round" fill="none"/>
      <!-- 高光 -->
      <ellipse cx="152" cy="152" rx="16" ry="9" fill="#fff" opacity=".55" transform="rotate(-28 152 152)"/>
    </g>

    <!-- 小爪子（弹跳时露出） -->
    <g id="feet" opacity="0">
      <ellipse cx="150" cy="248" rx="11" ry="6" fill="#3A9A80"/>
      <ellipse cx="210" cy="248" rx="11" ry="6" fill="#3A9A80"/>
    </g>
  </svg>

  <div class="hint" id="hint">点一下给它浇水 🌱</div>
  <div class="pill">今日进度 <b id="count">0 / 3</b></div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var buddy=$('buddy'), leafL=$('leafL'), leafR=$('leafR'), eyes=$('eyes'),
      blush=$('blush'), smile=$('smile'), stem=$('stem'), halo=$('halo'),
      feet=$('feet'), particles=$('particles'), drops=$('drops'),
      countEl=$('count'), hint=$('hint'), stage=$('stage');

  // 生成漂浮粒子（确定性位置）
  var P=[], rnd=function(i){ var x=Math.sin(i*127.1+3.7)*43758.5453; return x-Math.floor(x); };
  for(var i=0;i<9;i++){
    var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    var px=48+rnd(i)*264, py=60+rnd(i+40)*220, r=2.5+rnd(i+80)*4;
    var cols=['#B7E7D6','#F7D98C','#F6B8AE','#E6F5EF'];
    c.setAttribute('cx',px.toFixed(1)); c.setAttribute('cy',py.toFixed(1));
    c.setAttribute('r',r.toFixed(1)); c.setAttribute('fill',cols[i%4]);
    c.setAttribute('opacity','.75');
    particles.appendChild(c);
    P.push({el:c, x:px, y:py, ph:rnd(i+120)*6.28, sp:.5+rnd(i+160)*.7, amp:6+rnd(i+200)*8});
  }
  // 水滴
  var D=[];
  for(var j=0;j<5;j++){
    var d=document.createElementNS('http://www.w3.org/2000/svg','path');
    d.setAttribute('d','M0 0 C -4 6 -4 10 0 10 C 4 10 4 6 0 0 Z');
    d.setAttribute('fill','#79C9B4'); d.setAttribute('opacity','0');
    drops.appendChild(d);
    D.push({el:d, x:180+(j-2)*20, off:j*.12});
  }

  var progress=0, popT=-1, popX=180, popY=180, running=true, t0=0;

  function frame(t){
    // t: 归一化 0..1，循环周期 4s
    var s=Math.sin(t*Math.PI*2), s2=Math.sin(t*Math.PI*4+0.8), s3=Math.sin(t*Math.PI*2+1.6);
    var grow=1+progress*0.11;
    // 呼吸 + 上下浮动（弹跳叠加）
    var pop=0, popSq=1;
    if(popT>=0){
      var p=popT/0.55;
      if(p<1){ pop=-Math.sin(p*Math.PI)*16; popSq=1+Math.sin(p*Math.PI)*0.09; }
    }
    var breathe=1+(s2*0.018)*grow;
    buddy.setAttribute('transform',
      'translate(180 184) scale('+(breathe*grow*popSq).toFixed(4)+') translate(-180 -184) '+
      'translate(0 '+((s*3+pop)).toFixed(2)+')');
    // 叶子摆动
    leafL.setAttribute('transform','rotate('+(-32+s*7).toFixed(2)+' 180 84)');
    leafR.setAttribute('transform','rotate('+(32-s*7).toFixed(2)+' 180 84)');
    stem.setAttribute('transform','rotate('+(s*2.5).toFixed(2)+' 180 118)');
    // 眨眼：周期 4s 内两处短眨
    var bt=t*4 % 1;
    var blink=(bt<0.035|| (bt>0.46&&bt<0.495)) ? 0.12 : 1;
    eyes.setAttribute('transform','translate(180 178) scale(1 '+blink.toFixed(3)+') translate(-180 -178)');
    // 微笑随进度/呼吸微张
    var lift=4+s3*1.6+progress*2;
    smile.setAttribute('d','M164 '+(202-lift/2).toFixed(1)+' Q180 '+(216+lift).toFixed(1)+' 196 '+(202-lift/2).toFixed(1));
    // 腮红脉冲
    blush.setAttribute('opacity',(0.7+0.25*s3).toFixed(3));
    // 光晕呼吸
    halo.setAttribute('r',(112+s2*6+progress*8).toFixed(1));
    // 小爪子：弹跳时露出
    feet.setAttribute('opacity', popT>=0 ? '0.9' : '0');
    // 漂浮粒子
    for(var i=0;i<P.length;i++){
      var q=P[i], dy=Math.sin(t*Math.PI*2*q.sp+q.ph)*q.amp;
      q.el.setAttribute('cy',(q.y+dy).toFixed(1));
      q.el.setAttribute('cx',(q.x+Math.cos(t*Math.PI*2*q.sp*.6+q.ph)*3).toFixed(1));
    }
    // 水滴（点击后 0~0.6 秒）
    for(var k=0;k<D.length;k++){
      var w=D[k];
      if(popT>=0){
        var lp=(popT-w.off)/0.5;
        if(lp>0 && lp<1){
          w.el.setAttribute('opacity',(1-lp).toFixed(2));
          w.el.setAttribute('transform','translate('+(w.x)+' '+(70+lp*70)+') scale('+(0.8+lp*0.5).toFixed(2)+')');
        } else w.el.setAttribute('opacity','0');
      } else w.el.setAttribute('opacity','0');
    }
  }

  function loop(now){
    if(!running) return;
    if(!t0) t0=now;
    var t=((now-t0)/4000)%1;
    if(popT>=0){ popT+=1/60; if(popT>0.8) popT=-1; }
    frame(t);
    requestAnimationFrame(loop);
  }

  // 确定性截帧接口：setFrame(i, total) 暂停实时动画并按帧号渲染
  window.setFrame=function(i,total){
    running=false;
    var t=i/total;
    popT=-1;
    frame(t);
  };
  window.setProgress=function(p){ progress=Math.max(0,Math.min(3,p)); countEl.textContent=progress+' / 3'; };
  window.resume=function(){ running=true; t0=0; requestAnimationFrame(loop); };

  stage.addEventListener('click',function(e){
    progress=Math.min(3,progress+1);
    countEl.textContent=progress+' / 3';
    hint.textContent = progress>=3 ? '长满啦，好棒！🎉 再点一下重新开始' : '再浇一点就长大啦 🌿';
    if(progress>=3) setTimeout(function(){ progress=0; countEl.textContent='0 / 3'; hint.textContent='点一下给它浇水 🌱'; },1600);
    popT=0;
    if(running) return; // 实时循环里由 loop 推进
    var start=performance.now();
    (function step(now){
      var el=(now-start)/1000;
      popT=el; frame(((now%4000)/4000));
      if(el<0.8) requestAnimationFrame(step);
      else { popT=-1; frame(0); }
    })(start);
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
